name: Build Nova Apex APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with Gradle 8.5
        run: |
          set -e

          # 1. Unzip project if uploaded as zip
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting: $z"
              unzip -q -o "$z"
            fi
          done

          # 2. Find settings.gradle
          SETTINGS=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            ls -la
            exit 1
          fi

          BUILD_DIR=$(dirname "$SETTINGS")
          echo "Building inside directory: $BUILD_DIR"
          cd "$BUILD_DIR"

          # 3. Write SDK path for Gradle
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          # 4. Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # 5. Download and run Gradle 8.5
          if [ ! -d "/tmp/gradle-8.5" ]; then
            echo "Downloading Gradle 8.5..."
            curl -sLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q -o /tmp/gradle.zip -d /tmp
          fi

          echo "Compiling Android Live Wallpaper APK..."
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaApex-LiveWallpaper-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
