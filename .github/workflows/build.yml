name: Build Nova Apex APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project and Build APK
        run: |
          set -e
          mkdir -p app/src/main/java/com/nova/apex/wallpaper app/src/main/res/xml app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'NovaApexLiveWallpaper'
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nova.apex.wallpaper'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.nova.apex.wallpaper'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.nova.apex.wallpaper">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application android:label="Nova Apex Wallpaper" android:supportsRtl="true">
                  <service android:name=".NovaLiveWallpaperService" android:exported="true" android:label="Nova Apex Wallpaper" android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter><action android:name="android.service.wallpaper.WallpaperService" /></intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

          cat << 'EOF' > app/src/main/java/com/nova/apex/wallpaper/NovaLiveWallpaperService.java
          package com.nova.apex.wallpaper;
          import android.graphics.Canvas;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.wallpaper.WallpaperService;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;
          import android.webkit.WebView;

          public class NovaLiveWallpaperService extends WallpaperService {
              @Override
              public Engine onCreateEngine() {
                  return new Engine() {
                      private WebView v;
                      private final Handler h = new Handler(Looper.getMainLooper());
                      private boolean vis = false;
                      @Override
                      public void onCreate(SurfaceHolder sh) {
                          super.onCreate(sh);
                          setTouchEventsEnabled(true);
                          h.post(() -> {
                              v = new WebView(NovaLiveWallpaperService.this);
                              v.getSettings().setJavaScriptEnabled(true);
                              v.loadUrl("file:///android_asset/nova_apex.html");
                              v.layout(0, 0, 1080, 2400);
                          });
                      }
                      @Override
                      public void onSurfaceChanged(SurfaceHolder sh, int f, int w, int ht) {
                          h.post(() -> { if (v != null) v.layout(0, 0, w, ht); });
                      }
                      @Override
                      public void onVisibilityChanged(boolean visible) {
                          vis = visible;
                          h.post(() -> { if (v != null) { if (vis) { v.onResume(); loop(); } else v.onPause(); } });
                      }
                      private void loop() {
                          if (!vis) return;
                          SurfaceHolder sh = getSurfaceHolder();
                          Canvas c = null;
                          try { c = sh.lockCanvas(); if (c != null && v != null) v.draw(c); }
                          finally { if (c != null) sh.unlockCanvasAndPost(c); }
                          h.postDelayed(this::loop, 16);
                      }
                      @Override
                      public void onTouchEvent(MotionEvent e) {
                          h.post(() -> { if (v != null) v.dispatchTouchEvent(e); });
                      }
                      @Override
                      public void onDestroy() {
                          super.onDestroy();
                          h.post(() -> { if (v != null) { v.destroy(); v = null; } });
                      }
                  };
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/nova_apex.html
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#070b14;color:#fff;font-family:sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:30px 20px;}.hdr{display:flex;justify-content:space-between;width:100%;font-size:12px;font-weight:bold;color:#00f2fe;}.stg{position:relative;width:100%;max-width:340px;height:340px;}canvas{width:100%;height:100%;}.bar{display:flex;gap:10px;width:100%;max-width:300px;}.btn{flex:1;padding:12px;border-radius:12px;border:1px solid #1e293b;background:rgba(15,23,42,0.8);color:#94a3b8;font-size:12px;font-weight:bold;text-align:center;cursor:pointer;}.btn.act{border-color:#00f2fe;color:#fff;background:rgba(0,242,254,0.25);}</style></head><body><div class="hdr"><span id="b1">✦ GEMINI ACTIVE</span><span id="b2" style="color:#10b981;">IDLE READY</span></div><div class="stg"><canvas id="cv" width="340" height="340"></canvas></div><div class="bar"><div id="bg" class="btn act">✦ Gemini</div><div id="bc" class="btn">✳ Claude</div><div id="bp" class="btn">⚡ Pulse</div></div><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let ai='gemini',rx=0.35,ry=0.25,p=0,ang=0;function pr(x,y,z){const cy=Math.cos(ry),sy=Math.sin(ry),x1=x*cy+z*sy,z1=-x*sy
          
