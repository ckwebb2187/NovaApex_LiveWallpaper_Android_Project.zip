name: Build Nova Apex APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/nova/apex/wallpaper app/src/main/res/xml app/src/main/assets
          printf "pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = 'NovaApex'\ninclude ':app'\n" > settings.gradle
          printf "plugins {\n  id 'com.android.application' version '8.2.2' apply false\n}\n" > build.gradle
          printf "plugins {\n  id 'com.android.application'\n}\nandroid {\n  namespace 'com.nova.apex.wallpaper'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.nova.apex.wallpaper'\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName '1.0'\n  }\n}\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.nova.apex.wallpaper"><uses-feature android:name="android.software.live_wallpaper"/><application android:label="Nova Apex"><service android:name=".S" android:exported="true" android:permission="android.permission.BIND_WALLPAPER"><intent-filter><action android:name="android.service.wallpaper.WallpaperService"/></intent-filter><meta-data android:name="android.service.wallpaper" android:resource="@xml/w"/></service></application></manifest>' > app/src/main/AndroidManifest.xml
