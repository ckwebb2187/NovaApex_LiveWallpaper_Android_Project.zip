name: Build Nova Apex APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/nova/apex/wallpaper app/src/main/res/xml app/src/main/assets
          printf "pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = 'NovaApex'\ninclude ':app'\n" > settings.gradle
          printf "plugins {\n  id 'com.android.application' version '8.2.2' apply false\n}\n" > build.gradle
          printf "plugins {\n  id 'com.android.application'\n}\nandroid {\n  namespace 'com.nova.apex.wallpaper'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.nova.apex.wallpaper'\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName '1.0'\n  }\n}\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.nova.apex.wallpaper"><uses-feature android:name="android.software.live_wallpaper"/><application android:label="Nova Apex"><service android:name=".S" android:exported="true" android:permission="android.permission.BIND_WALLPAPER"><intent-filter><action android:name="android.service.wallpaper.WallpaperService"/></intent-filter><meta-data android:name="android.service.wallpaper" android:resource="@xml/w"/></service></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<wallpaper xmlns:android="http://schemas.android.com/apk/res/android"/>' > app/src/main/res/xml/w.xml
          echo 'package com.nova.apex.wallpaper;import android.graphics.Canvas;import android.os.*;import android.service.wallpaper.WallpaperService;import android.view.*;import android.webkit.WebView;public class S extends WallpaperService{public Engine onCreateEngine(){return new Engine(){WebView v;Handler h=new Handler(Looper.getMainLooper());boolean vis;public void onCreate(SurfaceHolder sh){super.onCreate(sh);setTouchEventsEnabled(true);h.post(()->{v=new WebView(S.this);v.getSettings().setJavaScriptEnabled(true);v.loadUrl("file:///android_asset/a.html");v.layout(0,0,1080,2400);});}public void onSurfaceChanged(SurfaceHolder sh,int f,int w,int ht){h.post(()->{if(v!=null)v.layout(0,0,w,ht);});}public void onVisibilityChanged(boolean b){vis=b;h.post(()->{if(v!=null){if(vis){v.onResume();l();}else v.onPause();}});}void l(){if(!vis)return;SurfaceHolder sh=getSurfaceHolder();Canvas c=null;try{c=sh.lockCanvas();if(c!=null&&v!=null)v.draw(c);}finally{if(c!=null)sh.unlockCanvasAndPost(c);}h.postDelayed(this::l,16);}public void onTouchEvent(MotionEvent e){h.post(()->{if(v!=null)v.dispatchTouchEvent(e);});}public void onDestroy(){super.onDestroy();h.post(()->{if(v!=null){v.destroy();v=null;}});}};}}' > app/src/main/java/com/nova/apex/wallpaper/S.java
          echo '<!DOCTYPE html><html><body style="background:#070b14;margin:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;"><canvas id="c" width="340" height="340"></canvas><div style="color:#00f2fe;font-family:sans-serif;font-size:14px;font-weight:bold;margin-top:20px;">✦ NOVA APEX NEURAL CORE</div><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let a=0;function d(){ctx.clearRect(0,0,340,340);a+=0.02;[120,90,60].forEach((r,i)=>{ctx.strokeStyle=i===0?"#00f2fe":i===1?"#818cf8":"#fff";ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<=32;j++){let th=(j/32)*Math.PI*2+(i%2?a:-a);let x=170+Math.cos(th)*r,y=170+Math.sin(th)*r*0.6;if(!j)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();});let g=ctx.createRadialGradient(170,170,2,170,170,45);g.addColorStop(0,"#fff");g.addColorStop(0.5,"#00f2fe");g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.beginPath();ctx.arc(170,170,45+Math.sin(a*4)*5,0,Math.PI*2);ctx.fill();requestAnimationFrame(d);}d();</script></body></html>' > app/src/main/assets/a.html
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          curl -sLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q -o /tmp/g.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaApex-LiveWallpaper-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
