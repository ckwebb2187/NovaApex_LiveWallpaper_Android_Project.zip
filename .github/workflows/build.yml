name: Build Nova Apex Studio APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Load signing key
        env:
          NOVA_KEYSTORE: ${{ secrets.NOVA_KEYSTORE }}
        run: |
          if [ -n "$NOVA_KEYSTORE" ]; then
            echo "$NOVA_KEYSTORE" | base64 -d > app/release.keystore
          else
            echo "::warning::NOVA_KEYSTORE secret not set; using a throwaway key, so in-app updates won't install over this build."
          fi

      - name: Build debug APK
        env:
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk NovaApex.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaApex-Studio-APK
          path: NovaApex.apk
          if-no-files-found: error

      # Builds from main become a release; the app checks the latest release for updates
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova Apex build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: NovaApex.apk
          make_latest: true
