name: Build Nova Apex Studio APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Studio APK
        run: |
          mkdir -p app/src/main/java/com/nova/apex/wallpaper app/src/main/res/xml app/src/main/assets
          printf "pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = 'NovaApex'\ninclude ':app'\n" > settings.gradle
          printf "plugins {\n  id 'com.android.application' version '8.2.2' apply false\n}\n" > build.gradle
          printf "plugins {\n  id 'com.android.application'\n}\nandroid {\n  namespace 'com.nova.apex.wallpaper'\n  compileSdk 34\n  defaultConfig {\n    applicationId 'com.nova.apex.wallpaper'\n    minSdk 24\n    targetSdk 34\n    versionCode 2\n    versionName '2.0'\n  }\n}\n" > app/build.gradle
          echo '' | base64 -d | gunzip > app/src/main/AndroidManifest.xml
          echo 'H4sIAB3s52oC/z2NQQ7CIBBF9z0Fmb2D7gwpbTyAhyCAlkiBMCPW28uC+Hf/5f+8eT32KJqvFHLScMEzCJ9sdiE9Nbz5cbrCukzzx8RYTPFV9H0iZZKrOTgNG3NRUpLd/G4IB0ebd2nKS1ZPcjCYRM8oijxzd9DNcmiBvxr6BVNuBrvmwL8Q7yDk8gNVdn8BqAAAAA==' | base64 -d | gunzip > app/src/main/res/xml/w.xml
          echo '' | base64 -d | gunzip > app/src/main/java/com/nova/apex/wallpaper/M.java
          echo '' | base64 -d | gunzip > app/src/main/java/com/nova/apex/wallpaper/S.java
          echo '' | base64 -d | gunzip > app/src/main/assets/a.html
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          curl -sLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q -o /tmp/g.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaApex-Studio-v2-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
