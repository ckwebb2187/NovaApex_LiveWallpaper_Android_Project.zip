plugins {
  id 'com.android.application'
}

android {
  namespace 'com.nova.apex.wallpaper'
  compileSdk 34

  defaultConfig {
    applicationId 'com.nova.apex.wallpaper'
    minSdk 24
    targetSdk 34
    versionCode 4
    versionName '3.0'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}
